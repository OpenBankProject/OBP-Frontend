name: build and publish container

on:
  push:
    branches:
    - main

env:
  DOCKER_HUB_ORGANIZATION: ${{ vars.DOCKER_HUB_ORGANIZATION }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
      - name: Build the Docker images with latest tag
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin docker.io
          docker build . -f Dockerfile_portal --build-arg GIT_COMMIT=$GITHUB_SHA --build-arg GIT_BRANCH=${{ github.ref_name }} --tag docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/obp-portal:$GITHUB_SHA --tag docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/obp-portal:main --tag docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/obp-portal:latest
          docker build . -f Dockerfile_apimanager  --build-arg GIT_COMMIT=$GITHUB_SHA --build-arg GIT_BRANCH=${{ github.ref_name }} --tag docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/api-manager-ii:$GITHUB_SHA --tag docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/api-manager-ii:main --tag docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/api-manager-ii:latest
          docker push docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/obp-portal --all-tags
          docker push docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/api-manager-ii --all-tags
          echo docker obp-portal with latest tag done

      - uses: sigstore/cosign-installer@main
      - name: Write signing key to disk (only needed for `cosign sign --key`)
        run: echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
      - name: Sign container image with annotations from our environment
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign -y --key cosign.key \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/obp-portal:main;\
          cosign sign -y --key cosign.key \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/api-manager-ii:main



