name: unit tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync SvelteKit
        run: npm run prepare --workspaces --if-present

      - name: Run unit tests
        run: npm run test:unit --workspaces --if-present -- --run
